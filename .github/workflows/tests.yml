name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install homeassistant tinytuya tuya-device-sharing-sdk pytest
      - name: Run tests
        env:
          TUYA_HP_REQUIRE_HA: "1"
        run: python -m pytest -q tests
