template:
- number:
  - name: HP Occupied heating air setpoint (°C)
    unique_id: hp_gchv_w421
    min: 16
    max: 32
    step: 1
    availability: '{{ is_number(states(''sensor.hp_gchv_r421'')) }}'
    state: '{{ (states(''sensor.hp_gchv_r421'') | float(0)) * 0.1 }}'
    set_value:
    - service: modbus.write_register
      data:
        hub: heatpump
        slave: 11
        address: 421
        value: '{{ ((value | float) / 0.1) | round | int }}'
    - service: homeassistant.update_entity
      target:
        entity_id: sensor.hp_gchv_r421
  - name: HP Booster delta temperature (°C)
    unique_id: hp_gchv_w603
    min: 1
    max: 20
    step: 1
    availability: '{{ is_number(states(''sensor.hp_gchv_r603'')) }}'
    state: '{{ (states(''sensor.hp_gchv_r603'') | float(0)) * 0.1 }}'
    set_value:
    - service: modbus.write_register
      data:
        hub: heatpump
        slave: 11
        address: 603
        value: '{{ ((value | float) / 0.1) | round | int }}'
    - service: homeassistant.update_entity
      target:
        entity_id: sensor.hp_gchv_r603
