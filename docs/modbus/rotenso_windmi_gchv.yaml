template:
- sensor:
  - name: HP Night mode start time
    unique_id: hp_gchv_t518
    availability: '{{ is_number(states(''sensor.hp_gchv_r518_0206h'')) }}'
    state: '{{ ''%02d:%02d'' | format((states(''sensor.hp_gchv_r518_0206h'') | int(0)) // 256, (states(''sensor.hp_gchv_r518_0206h'') | int(0)) % 256) }}'
  - name: HP Night mode end time
    unique_id: hp_gchv_t519
    availability: '{{ is_number(states(''sensor.hp_gchv_r519_0207h'')) }}'
    state: '{{ ''%02d:%02d'' | format((states(''sensor.hp_gchv_r519_0207h'') | int(0)) // 256, (states(''sensor.hp_gchv_r519_0207h'') | int(0)) % 256) }}'
  - name: HP DHW schedule start time
    unique_id: hp_gchv_t712
    availability: '{{ is_number(states(''sensor.hp_gchv_r712_02c8h'')) }}'
    state: '{{ ''%02d:%02d'' | format((states(''sensor.hp_gchv_r712_02c8h'') | int(0)) // 256, (states(''sensor.hp_gchv_r712_02c8h'') | int(0)) % 256) }}'
  - name: HP DHW schedule stop time
    unique_id: hp_gchv_t713
    availability: '{{ is_number(states(''sensor.hp_gchv_r713_02c9h'')) }}'
    state: '{{ ''%02d:%02d'' | format((states(''sensor.hp_gchv_r713_02c9h'') | int(0)) // 256, (states(''sensor.hp_gchv_r713_02c9h'') | int(0)) % 256) }}'
  - name: HP Anti-legionella schedule start time
    unique_id: hp_gchv_t715
    availability: '{{ is_number(states(''sensor.hp_gchv_r715_02cbh'')) }}'
    state: '{{ ''%02d:%02d'' | format((states(''sensor.hp_gchv_r715_02cbh'') | int(0)) // 256, (states(''sensor.hp_gchv_r715_02cbh'') | int(0)) % 256) }}'
  - name: HP Running mode
    unique_id: hp_running_mode
    availability: '{{ is_number(states(''sensor.hp_gchv_r45_002dh'')) }}'
    state: '{% set v = (states(''sensor.hp_gchv_r45_002dh'') | int(0)) %}{% set m = {0: ''Off'', 1: ''Cool'', 2: ''Heat'', 4: ''DHW'', 7: ''Defrost'', 20: ''Home anti-freeze (unit protection)''} %}{{ m[v]
      if v in m else ''Unknown '' ~ v }}'
  - name: HP Normal / Eco status
    unique_id: hp_normal_eco_status
    availability: '{{ is_number(states(''sensor.hp_gchv_r103_0067h'')) }}'
    state: '{% set v = (states(''sensor.hp_gchv_r103_0067h'') | int(0)) %}{% set m = {0: ''Normal'', 1: ''Eco''} %}{{ m[v] if v in m else ''Unknown '' ~ v }}'
  - name: HP DHW mode
    unique_id: hp_dhw_mode
    availability: '{{ is_number(states(''sensor.hp_gchv_r201_00c9h'')) }}'
    state: '{% set v = (states(''sensor.hp_gchv_r201_00c9h'') | int(0)) %}{% set m = {0: ''Eco'', 1: ''Anti-legionella'', 2: ''Regular''} %}{{ m[v] if v in m else ''Unknown '' ~ v }}'
  - name: HP P6 (IPM protection) reason
    unique_id: hp_p6_ipm_protection_reason
    availability: '{{ is_number(states(''sensor.hp_gchv_r4130_1022h'')) }}'
    state: '{% set v = (states(''sensor.hp_gchv_r4130_1022h'') | int(0)) %}{% set m = {0: ''None'', 10: ''IPM error'', 1: ''DC voltage too low'', 2: ''DC voltage too high'', 4: ''MCE error / synchronisation
      / closed loop'', 5: ''Compressor speed fault'', 7: ''Phase error'', 8: ''Compressor speed changing fault'', 9: ''Compressor speed incorrect''} %}{{ m[v] if v in m else ''Unknown '' ~ v }}'
  - name: HP Modbus parity
    unique_id: hp_modbus_parity
    availability: '{{ is_number(states(''sensor.hp_gchv_r4146_1032h'')) }}'
    state: '{% set v = (states(''sensor.hp_gchv_r4146_1032h'') | int(0)) %}{% set m = {0: ''None'', 1: ''Odd'', 2: ''Even''} %}{{ m[v] if v in m else ''Unknown '' ~ v }}'
  - name: HP Compressor frequency limitation reason 1
    unique_id: hp_compressor_frequency_limitation_reason_1
    availability: '{{ is_number(states(''sensor.hp_gchv_r4121_1019h'')) }}'
    state: '{% set v = (states(''sensor.hp_gchv_r4121_1019h'') | int(0)) %}{% set ns = namespace(r=[]) %}{% for b, n in [(1, ''T3B ODU coil''), (2, ''T4''), (4, ''T5''), (8, ''Voltage''), (16, ''Current''),
      (32, ''T9''), (64, ''Night mode''), (128, ''LWT'')] %}{% if v | bitwise_and(b) %}{% set ns.r = ns.r + [n] %}{% endif %}{% endfor %}{{ ns.r | join('', '') if ns.r else ''None'' }}'
  - name: HP Compressor frequency limitation reason 2
    unique_id: hp_compressor_frequency_limitation_reason_2
    availability: '{{ is_number(states(''sensor.hp_gchv_r4133_1025h'')) }}'
    state: '{% set v = (states(''sensor.hp_gchv_r4133_1025h'') | int(0)) %}{% set ns = namespace(r=[]) %}{% for b, n in [(1, ''LWT/EWT tolerance''), (2, ''Heating SH3''), (4, ''T4 lowest frequency''), (8,
      ''Cooling T2B'')] %}{% if v | bitwise_and(b) %}{% set ns.r = ns.r + [n] %}{% endif %}{% endfor %}{{ ns.r | join('', '') if ns.r else ''None'' }}'
  - name: HP Alarm bitmap 1
    unique_id: hp_alarm_bitmap_1
    availability: '{{ is_number(states(''sensor.hp_gchv_r4105_1009h'')) }}'
    state: '{% set v = (states(''sensor.hp_gchv_r4105_1009h'') | int(0)) %}{% set ns = namespace(r=[]) %}{% for b, n in [(1, ''Water flow switch fail''), (2, ''Comm fail ODU - hydraulic PCB''), (4, ''LWT
      sensor after EH fail''), (8, ''BPHE outlet refrigerant sensor fail''), (16, ''BPHE inlet refrigerant sensor fail''), (32, ''ODU fail''), (64, ''DHW tank sensor fail''), (128, ''EWT of BPHE sensor
      fail''), (256, ''LWT of BPHE sensor fail''), (512, ''Comm fail wired controller - PCB''), (1024, ''Bi-zone sensor fail''), (2048, ''Auxiliary heat LWT sensor fail'')] %}{% if v | bitwise_and(b) %}{%
      set ns.r = ns.r + [n] %}{% endif %}{% endfor %}{{ ns.r | join('', '') if ns.r else ''OK'' }}'
  - name: HP Alarm bitmap 2
    unique_id: hp_alarm_bitmap_2
    availability: '{{ is_number(states(''sensor.hp_gchv_r4106_100ah'')) }}'
    state: '{% set v = (states(''sensor.hp_gchv_r4106_100ah'') | int(0)) %}{% set ns = namespace(r=[]) %}{% for b, n in [(2, ''Temperature difference EWT/LWT too high''), (4, ''Water flow rate shortage''),
      (8, ''Temperature difference WT/LWT abnormal''), (64, ''EH feedback protect'')] %}{% if v | bitwise_and(b) %}{% set ns.r = ns.r + [n] %}{% endif %}{% endfor %}{{ ns.r | join('', '') if ns.r else ''OK''
      }}'
  - name: HP Alarm bitmap 3
    unique_id: hp_alarm_bitmap_3
    availability: '{{ is_number(states(''sensor.hp_gchv_r4107_100bh'')) }}'
    state: '{% set v = (states(''sensor.hp_gchv_r4107_100bh'') | int(0)) %}{% set ns = namespace(r=[]) %}{% for b, n in [(1, ''Condenser sensor fail''), (2, ''Discharge temp sensor fail''), (8, ''BPHE outlet
      refrigerant high temp protection''), (16, ''P6 error 3 times in 30 min''), (32, ''AC voltage abnormal''), (64, ''OAT sensor fail''), (128, ''Over current protection''), (256, ''IPM protection (P6)''),
      (512, ''3x high discharge temp in 100 min (H6)''), (1024, ''3x IPM high temp in 60 min (H12)''), (2048, ''EEPROM alarm (E10)''), (4096, ''High pressure protection (P1)''), (8192, ''3x low pressure
      in 30 min (H5)''), (16384, ''2x DC fan motor alarm in 10 min (H9)''), (32768, ''Condenser temp too high (P5)'')] %}{% if v | bitwise_and(b) %}{% set ns.r = ns.r + [n] %}{% endif %}{% endfor %}{{ ns.r
      | join('', '') if ns.r else ''OK'' }}'
  - name: HP Alarm bitmap 4
    unique_id: hp_alarm_bitmap_4
    availability: '{{ is_number(states(''sensor.hp_gchv_r4108_100ch'')) }}'
    state: '{% set v = (states(''sensor.hp_gchv_r4108_100ch'') | int(0)) %}{% set ns = namespace(r=[]) %}{% for b, n in [(1, ''Comm fail IDU - ODU (E2)''), (2, ''ODU fan motor error (P9)''), (4, ''IPM temp
      too high (Pb)''), (8, ''IDU quantity decrease (H7)''), (16, ''3x over current in 60 min (H10)''), (32, ''Discharge sensor fail (P4)''), (64, ''Refrigerant cool pipe sensor fail (Ec)''), (128, ''Low
      pressure protection (P2)'')] %}{% if v | bitwise_and(b) %}{% set ns.r = ns.r + [n] %}{% endif %}{% endfor %}{{ ns.r | join('', '') if ns.r else ''OK'' }}'
